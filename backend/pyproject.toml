[project]
name = "finsentinel-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "SQLAlchemy>=2.0,<3", "PyMuPDF>=1.24,<2", "requests>=2.32,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
py-modules = ["fitz", "sitecustomize"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
agents = ["langgraph>=0.2,<2", "langchain>=0.3,<2", "langchain-openai>=0.2,<2"]
postgres = ["psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "alembic>=1.13,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["."]
