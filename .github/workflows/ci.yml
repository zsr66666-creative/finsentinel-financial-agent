name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: finsentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finsentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - run: git rev-parse HEAD && git grep -n "import fitz\|import pymupdf" -- backend/tests/test_ingestion_pipeline.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install -e backend --no-deps
      - run: python -c "from app.main import create_app; import fitz; print('imports ok')"
      - run: python -c "import pymupdf, requests; print('PyMuPDF', pymupdf.VersionBind); print('requests', requests.__version__)"
      - name: Collect backend tests from repository root
        run: python -m pytest backend/tests --collect-only -q
      - name: Run complete backend suite from backend directory
        run: python -m pytest -ra --junitxml=pytest-results.xml
        working-directory: backend
      - name: PostgreSQL account concurrency and persistence
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci_test_only@127.0.0.1:5432/finsentinel_test
        run: python -m scripts.accounts_pg_acceptance --output accounts-postgres.json
      - name: PostgreSQL personal research isolation and persistence
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci_test_only@127.0.0.1:5432/finsentinel_test
        run: python -m scripts.personal_research_pg_acceptance --output personal-research-postgres.json
      - name: PostgreSQL saved report isolation and persistence
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci_test_only@127.0.0.1:5432/finsentinel_test
        run: python -m scripts.saved_reports_pg_acceptance --output saved-reports-postgres.json
      - name: Install PostgreSQL 16 backup clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: PostgreSQL snapshot backup and isolated restore
        env:
          OPERATIONS_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci_test_only@127.0.0.1:5432/finsentinel_test
        run: PATH="/usr/lib/postgresql/16/bin:$PATH" python -m pytest backend/tests/test_operations_backup.py -q -ra
      - name: Summarize backend test results
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('backend/pytest-results.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not report.exists():
                  summary.write('Backend test report missing: inspect collection/setup errors.\n')
              else:
                  suites = ET.parse(report).getroot().findall('testsuite')
                  counts = {key: sum(int(s.get(key, 0)) for s in suites)
                            for key in ('tests', 'failures', 'errors', 'skipped')}
                  for case in ET.parse(report).getroot().iter('testcase'):
                      failure = case.find('failure')
                      if failure is None: failure = case.find('error')
                      if failure is not None:
                          detail = (case.get('name', '') + ': ' + (failure.text or failure.get('message', '')))[:10000]
                          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::error title=Backend test failure::' + detail)
                  summary.write('## Complete backend suite\n\n')
                  summary.write(' | '.join(f'{key}: {value}' for key, value in counts.items()) + '\n')
          PY
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/ecs/deploy-research-desk.sh
      - run: bash -n deploy/ecs/install-ip-https.sh
      - run: bash -n deploy/ecs/install-accounts-offline.sh
      - run: bash -n deploy/ecs/install-operations-offline.sh
      - run: bash -n deploy/ecs/install-research-library-offline.sh
      - run: bash -n deploy/ecs/install-report-reader-offline.sh
      - run: bash -n deploy/ecs/install-saved-reports-offline.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
