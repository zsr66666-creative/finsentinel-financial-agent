name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - run: git rev-parse HEAD && git grep -n "import fitz\|import pymupdf" -- backend/tests/test_ingestion_pipeline.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install -e backend --no-deps
      - run: python -c "from app.main import create_app; import fitz; print('imports ok')"
      - run: python -c "import pymupdf, requests; print('PyMuPDF', pymupdf.VersionBind); print('requests', requests.__version__)"
      - name: Collect backend tests from repository root
        run: python -m pytest backend/tests --collect-only -q
      - name: Run complete backend suite from backend directory
        run: python -m pytest -ra --junitxml=pytest-results.xml
        working-directory: backend
      - name: Summarize backend test results
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('backend/pytest-results.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not report.exists():
                  summary.write('Backend test report missing: inspect collection/setup errors.\n')
              else:
                  suites = ET.parse(report).getroot().findall('testsuite')
                  counts = {key: sum(int(s.get(key, 0)) for s in suites)
                            for key in ('tests', 'failures', 'errors', 'skipped')}
                  summary.write('## Complete backend suite\n\n')
                  summary.write(' | '.join(f'{key}: {value}' for key, value in counts.items()) + '\n')
          PY
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/ecs/deploy-research-desk.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
